name: release-chart

on:
  push:
    branches: [develop]
    paths:
      - 'chart/**'

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint chart
        run: helm lint chart/

      - name: Package and push chart
        run: |
          VERSION="0.1.0-dev.${{ github.run_number }}"
          helm package chart/ --version "$VERSION" --app-version develop
          helm push mcp-server-*.tgz oci://ghcr.io/minutemailco/charts
